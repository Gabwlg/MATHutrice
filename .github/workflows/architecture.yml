# Runs the two checks documented in mathutrice/README.md, "Running the check":
# every import crossing a package boundary reaches a public name, and no two
# packages import each other. They are the commands a contributor runs locally,
# so a red run here is reproducible with two lines in a terminal.
name: Architecture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version: setup-uv publishes no floating `v10` tag.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # uv installs the interpreter pinned in .python-version itself, so there
      # is no separate Python setup step to keep in sync with it. The dev group,
      # which is where tach lives, is part of a default sync.
      - run: uv sync

      # scripts/check_cycles.py reads the real import graph from `tach map`, and
      # both commands expect the directory holding tach.toml -- the checkout
      # root, which is where a step starts.
      - run: uv run tach check

      - run: uv run python scripts/check_cycles.py

  # On a push to the default branch alone, once `architecture` has passed:
  # never on a pull request, never on a red run. One image per commit, tagged
  # with it, deployed to Fork staging.
  deploy-staging:
    name: deploy to staging
    needs: architecture
    if: github.event_name == 'push' && github.ref == 'refs/heads/course-2026-fallback-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One deploy at a time, in the order pushed.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v7

      # A commit pushed twice is built once. REVISION is the commit again,
      # inside the image: the app sends it back in an X-Revision header, so the
      # deploy can tell which image answered.
      - name: Build and push the image, unless it exists
        id: image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image already built"
          else
            docker build \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$image" .
            docker push "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Written at every deploy. The three secrets are the environment's own;
      # the rest is the same in both environments. --output none: the command
      # would otherwise print every setting back, secrets included.
      - name: Write staging's settings to its app
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" --output none \
            --settings \
              AUTH_MODE=dev \
              WEBSITES_PORT=8000 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
              DATABASE_URL=sqlite:///./mathutrice.db \
              LLM_BASE_URL=https://api.mistral.ai/v1 \
              LLM_MODEL=ministral-14b-latest \
              "SESSION_SECRET=$SESSION_SECRET" \
              "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
              "LLM_API_KEY=$LLM_API_KEY"

      # The image is public on GHCR, so the app pulls it without credentials.
      - name: Run the image
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" --output none \
            --container-image-name "${{ steps.image.outputs.image }}"

      # App Service keeps serving the previous container until the new one has
      # started, or failed to, so a 200 alone proves nothing. Wait until the
      # response carries this commit in X-Revision; fail the job if it does not.
      - name: Wait until the new image answers
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          url="https://$APP_NAME.azurewebsites.net/dev/login"
          limit=700
          start=$(date +%s)
          while true; do
            answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
            elapsed=$(( $(date +%s) - start ))
            if [ "$answer" = "200 $GITHUB_SHA" ]; then
              echo "$url answers 200 from $GITHUB_SHA, ${elapsed} s after the image was set"
              exit 0
            fi
            echo "${elapsed} s: $url answered ${answer:-nothing}, waiting for 200 $GITHUB_SHA"
            if [ "$elapsed" -ge "$limit" ]; then
              echo "$url did not answer 200 from $GITHUB_SHA within $limit s" >&2
              exit 1
            fi
            sleep 15
          done
