name: Architecture

on:
  push:
  pull_request:

jobs:
  boundaries-and-cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev

      - name: Check package boundaries
        run: uv run tach check

      - name: Check for import cycles
        run: uv run python scripts/check_cycles.py
